<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1012">
  <title>Simple Translator</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" data-icon="languages"></span>
        <span class="brand-name">Simple Translator</span>
      </div>
      <button type="button" class="btn btn-secondary btn-block" data-action="new-session">
        <span data-icon="plus"></span>新しいセッション
      </button>
      <nav class="session-list" id="session-list" aria-label="セッション"></nav>
      <div class="sidebar-foot">
        <button type="button" class="sidebar-settings" data-action="open-settings">
          <span data-icon="sliders"></span>
          <span class="sidebar-settings-text">
            <span>設定</span>
            <span class="model-label" id="model-label"></span>
          </span>
        </button>
      </div>
    </aside>
    <div class="backdrop" id="backdrop" data-action="close-sidebar"></div>

    <main class="main">
      <header class="topbar">
        <button type="button" class="icon-btn mobile-only" data-action="open-sidebar" aria-label="セッション一覧">
          <span data-icon="menu"></span>
        </button>
        <div class="topbar-title">
          <h1 id="session-title">Simple Translator</h1>
          <div class="pair" id="session-pair"></div>
        </div>
        <button type="button" class="icon-btn" id="edit-session-btn" data-action="edit-session" aria-label="セッションを編集" hidden>
          <span data-icon="pencil"></span>
        </button>
      </header>

      <section class="welcome" id="welcome" hidden>
        <button type="button" class="btn btn-primary" data-action="new-session">
          <span data-icon="plus"></span>新しいセッション
        </button>
      </section>

      <section class="thread" id="thread">
        <div class="thread-inner" id="messages"></div>
      </section>

      <footer class="composer-wrap" id="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" aria-label="翻訳するテキスト" autocomplete="off"></textarea>
          <div class="composer-bar">
            <button type="button" class="dir-chip" id="dir-chip" data-action="cycle-dir" title="翻訳の向き"></button>
            <button type="submit" class="send-btn" id="send-btn" aria-label="送信">
              <span data-icon="arrowUp"></span>
            </button>
          </div>
        </form>
      </footer>
    </main>
  </div>

  <dialog class="modal" id="session-dialog">
    <form method="dialog" id="session-form">
      <header class="modal-head">
        <h2 id="session-dialog-title">新しいセッション</h2>
        <button type="button" class="icon-btn" data-action="close-dialog" aria-label="閉じる"><span data-icon="x"></span></button>
      </header>
      <div class="modal-body">
        <label class="field">
          <span class="field-label">セッション名</span>
          <input type="text" name="title" maxlength="100">
        </label>
        <fieldset class="field">
          <legend class="field-label">相手の言語</legend>
          <div class="lang-options">
            <label class="lang-option">
              <input type="radio" name="targetLang" value="en" checked>
              <span class="lang-option-card"><b>English</b></span>
            </label>
            <label class="lang-option">
              <input type="radio" name="targetLang" value="zh">
              <span class="lang-option-card"><b>中文（简体）</b></span>
            </label>
          </div>
        </fieldset>
        <label class="field">
          <span class="field-label">用語メモ <small>任意</small></span>
          <textarea name="notes" rows="4"></textarea>
        </label>
      </div>
      <footer class="modal-foot">
        <button type="button" class="btn btn-danger-ghost" id="delete-session-btn" data-action="delete-session" hidden>
          <span data-icon="trash"></span>削除
        </button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-action="close-dialog">キャンセル</button>
        <button type="submit" class="btn btn-primary" id="session-submit">作成</button>
      </footer>
    </form>
  </dialog>

  <dialog class="modal" id="settings-dialog">
    <form method="dialog" id="settings-form">
      <header class="modal-head">
        <h2>設定</h2>
        <button type="button" class="icon-btn" data-action="close-dialog" aria-label="閉じる"><span data-icon="x"></span></button>
      </header>
      <div class="modal-body">
        <p class="section-label">LLM サーバー</p>
        <label class="field">
          <span class="field-label">API の URL</span>
          <input type="url" name="baseUrl" required>
        </label>
        <label class="field">
          <span class="field-label">API キー <small>任意</small></span>
          <input type="password" name="apiKey" autocomplete="off" placeholder="未設定">
        </label>
        <div class="field">
          <span class="field-label">モデル</span>
          <div class="input-row">
            <input type="text" name="model" list="model-options">
            <datalist id="model-options"></datalist>
            <button type="button" class="btn btn-secondary" data-action="test-connection">
              <span data-icon="refresh"></span>接続テスト
            </button>
          </div>
          <span class="connection-status" id="connection-status"></span>
        </div>

        <p class="section-label">翻訳</p>
        <label class="switch-field">
          <span class="field-label">思考モード</span>
          <input type="checkbox" name="enableThinking" class="switch">
        </label>
        <label class="field">
          <span class="field-label">Effort</span>
          <select name="reasoningEffort">
            <option value="">指定なし</option>
            <option value="low">low</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
            <option value="max">max</option>
          </select>
        </label>
        <div class="grid-2">
          <label class="field">
            <span class="field-label">参照する過去のやり取り</span>
            <span class="input-suffix"><input type="number" name="contextMessages" min="0" max="500" step="1"><span>件</span></span>
          </label>
          <label class="field">
            <span class="field-label">Temperature</span>
            <input type="number" name="temperature" min="0" max="2" step="0.1">
          </label>
        </div>
      </div>
      <footer class="modal-foot">
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-action="close-dialog">キャンセル</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </footer>
    </form>
  </dialog>

  <dialog class="modal modal-sm" id="confirm-dialog">
    <form method="dialog">
      <div class="modal-body">
        <h2 id="confirm-title"></h2>
      </div>
      <footer class="modal-foot">
        <span class="spacer"></span>
        <button type="submit" class="btn btn-ghost" value="cancel">キャンセル</button>
        <button type="submit" class="btn btn-danger" value="ok" id="confirm-ok">削除</button>
      </footer>
    </form>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
